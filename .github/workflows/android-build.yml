name: Android debug APK

on:
  push:
    branches:
      - main
      - feature/occt-step-v0.5.0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  occt:
    name: Build OCCT Android arm64
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Android NDK 29
        shell: bash
        run: |
          set -euxo pipefail
          export NDK_VERSION="29.0.14206865"
          test -d "$ANDROID_SDK_ROOT/ndk/$NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Restore OCCT Android cache
        id: occt-cache
        uses: actions/cache@v4
        with:
          path: |
            app/occt/arm64-v8a
            app/src/main/jniLibs/arm64-v8a
          key: occt-8.0.1-android-arm64-api26-ndk29-stepmesh-v2

      - name: Build pinned OCCT 8.0.1
        if: steps.occt-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf app/occt/arm64-v8a app/src/main/jniLibs/arm64-v8a occt-src occt-build
          git clone --depth 1 --branch V8.0.1 https://github.com/Open-Cascade-SAS/OCCT.git occt-src

          cmake -S occt-src -B occt-build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_LIBRARY_TYPE=Shared \
            -DBUILD_CPP_STANDARD=C++17 \
            -DBUILD_RELEASE_DISABLE_EXCEPTIONS=OFF \
            -DBUILD_USE_PCH=OFF \
            -DBUILD_RESOURCES=OFF \
            -DBUILD_MODULE_FoundationClasses=OFF \
            -DBUILD_MODULE_ModelingData=OFF \
            -DBUILD_MODULE_ModelingAlgorithms=OFF \
            -DBUILD_MODULE_Visualization=OFF \
            -DBUILD_MODULE_ApplicationFramework=OFF \
            -DBUILD_MODULE_DataExchange=OFF \
            -DBUILD_MODULE_Draw=OFF \
            -DBUILD_ADDITIONAL_TOOLKITS="TKDESTEP TKMesh" \
            -DUSE_FREETYPE=OFF \
            -DUSE_TK=OFF \
            -DUSE_TBB=OFF \
            -DUSE_FREEIMAGE=OFF \
            -DUSE_RAPIDJSON=OFF \
            -DUSE_DRACO=OFF \
            -DUSE_FFMPEG=OFF \
            -DUSE_OPENVR=OFF \
            -DUSE_EIGEN=OFF \
            -DINSTALL_DIR="$GITHUB_WORKSPACE/app/occt/arm64-v8a"

          cmake --build occt-build --target install --parallel 4

          test -f app/occt/arm64-v8a/include/opencascade/STEPControl_Reader.hxx
          test -f app/occt/arm64-v8a/lib/libTKDESTEP.so
          test -f app/occt/arm64-v8a/lib/libTKMesh.so

          mkdir -p app/src/main/jniLibs/arm64-v8a
          find app/occt/arm64-v8a/lib -maxdepth 1 -type f -name '*.so' -print -exec cp -f {} app/src/main/jniLibs/arm64-v8a/ \;

      - name: Package reusable OCCT bundle
        shell: bash
        run: |
          set -euxo pipefail
          test -f app/occt/arm64-v8a/include/opencascade/STEPControl_Reader.hxx
          test -n "$(find app/src/main/jniLibs/arm64-v8a -maxdepth 1 -name '*.so' -print -quit)"
          tar -czf occt-android-arm64.tgz \
            app/occt/arm64-v8a/include \
            app/occt/arm64-v8a/lib \
            app/src/main/jniLibs/arm64-v8a

      - name: Upload OCCT bundle
        uses: actions/upload-artifact@v4
        with:
          name: occt-8.0.1-android-arm64
          path: occt-android-arm64.tgz
          if-no-files-found: error
          retention-days: 30

  build:
    name: Build v0.5.0 APK
    needs: occt
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Android SDK and pinned NDK
        shell: bash
        run: |
          set -euxo pipefail
          test -d "$ANDROID_SDK_ROOT/platforms/android-36"
          test -d "$ANDROID_SDK_ROOT/ndk/29.0.14206865"

      - name: Download OCCT bundle
        uses: actions/download-artifact@v4
        with:
          name: occt-8.0.1-android-arm64
          path: .ci/occt

      - name: Restore OCCT files
        shell: bash
        run: |
          set -euxo pipefail
          tar -xzf .ci/occt/occt-android-arm64.tgz -C "$GITHUB_WORKSPACE"
          test -f app/occt/arm64-v8a/include/opencascade/STEPControl_Reader.hxx
          test -f app/src/main/jniLibs/arm64-v8a/libTKDESTEP.so

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify native CAD libraries are packaged
        shell: bash
        run: |
          set -euxo pipefail
          unzip -l app/build/outputs/apk/debug/app-debug.apk > apk-contents.txt
          grep -q 'lib/arm64-v8a/libocct_step_bridge.so' apk-contents.txt
          grep -q 'lib/arm64-v8a/libTKDESTEP.so' apk-contents.txt
          grep -q 'lib/arm64-v8a/libTKMesh.so' apk-contents.txt
          grep -q 'lib/arm64-v8a/libTKernel.so' apk-contents.txt

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Android3DViewer-v0.5.0-debug-arm64
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
